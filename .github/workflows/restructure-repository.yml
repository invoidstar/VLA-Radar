name: One-shot repository structure refactor
on:
  push:
    branches: [refactor/repository-structure-2026-09-20]
    paths:
      - '.github/workflows/restructure-repository.yml'
      - '.github/scripts/restructure_repo.py'
permissions:
  contents: write
concurrency:
  group: repository-structure-refactor
  cancel-in-progress: false
jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/repository-structure-2026-09-20
          fetch-depth: 0
      - name: Snapshot canonical and generated bytes
        run: |
          find catalog data -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/vla-radar-before.sha256
      - name: Restructure source, maintenance and tooling
        run: python .github/scripts/restructure_repo.py
      - name: Verify offline build and regressions
        run: |
          python scripts/build/build_catalog.py --check
          python scripts/validate/validate_all.py
          find catalog data -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/vla-radar-after.sha256
          diff -u /tmp/vla-radar-before.sha256 /tmp/vla-radar-after.sha256
          python -c "import json;from pathlib import Path;p=Path('maintenance/audits/release/repository-structure-refactor-20260920.json');a=json.loads(p.read_text());a['guarantees']['catalogByteIdentical']=True;a['guarantees']['dataByteIdentical']=True;a['validation']={'buildCatalogCheck':'pass','validateAll':'pass'};p.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\\n')"
      - name: Install browser regression dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Run all browser regressions against staged site
        run: |
          python scripts/browser/browser_smoke.py
          python scripts/browser/browser_workspace.py
          python scripts/browser/browser_news.py
          python scripts/browser/browser_sidebar.py
          python scripts/browser/browser_tools.py
          python scripts/browser/browser_leaderboard.py
      - name: Commit validated refactor to exact branch head
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          test "$BRANCH" = 'refactor/repository-structure-2026-09-20'
          actual=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$actual" = "$EXPECTED_SHA" || { echo 'Branch moved; refusing overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor repository structure without changing catalog data'
          git push origin "HEAD:refs/heads/$BRANCH"
