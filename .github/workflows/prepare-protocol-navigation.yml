name: Prepare source-group navigation
on:
  push:
    branches: [weekly-update-2026-09-19-protocol-navigation]
    paths: [.github/workflows/prepare-protocol-navigation.yml]
permissions:
  contents: write
concurrency:
  group: prepare-protocol-navigation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: 858b89685fa614ac335089b0dd4be6771f9e957a
      BRANCH: weekly-update-2026-09-19-protocol-navigation
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply reviewed UI patch
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          python - <<'PY'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          raw=base64.b64decode(Path('maintenance/.protocol-navigation-patch').read_bytes(),validate=True)
          assert len(raw)==6200 and hashlib.sha256(raw).hexdigest()=='724bb8b667b4468c4dbb9bfc822a9b15b08bea84c049f04ada2956d582ff51ef'
          obj=json.loads(lzma.decompress(raw));assert obj['schemaVersion']==1 and obj['baseCommit']==os.environ['BASE']
          allowed={'CHANGELOG.md','app.js','maintenance/leaderboard-analysis.md','research.css','research.js','scripts/browser_leaderboard.py','scripts/test_leaderboard_controls.cjs'}
          assert len(obj['files'])==len(allowed) and {f['path'] for f in obj['files']}==allowed
          planned=[]
          for f in obj['files']:
              p=Path(f['path']);old=p.read_bytes();assert hashlib.sha256(old).hexdigest()==f['before'],str(p)
              text=old.decode();end=0
              for a,b,replacement in f['edits']:
                  assert isinstance(a,int) and isinstance(b,int) and isinstance(replacement,str) and end<=a<=b<=len(text)
                  end=b
              for a,b,replacement in reversed(f['edits']):text=text[:a]+replacement+text[b:]
              out=text.encode();assert hashlib.sha256(out).hexdigest()==f['after'],str(p)
              planned.append((p,out))
          for p,out in planned:p.write_bytes(out)
          print('PASS: seven exact UI/doc/test target hashes')
          PY
          python scripts/build_catalog.py
          python scripts/validate_all.py
          git diff --exit-code "$BASE" -- catalog data maintenance/state.json maintenance/news-state.json maintenance/work-queue.json maintenance/benchmark-review.json
      - name: Install browser driver and fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update -qq; sudo apt-get install -y fonts-noto-cjk; fi
      - name: Run all six browser regression suites
        run: |
          python scripts/browser_smoke.py
          python scripts/browser_workspace.py
          python scripts/browser_news.py
          python scripts/browser_sidebar.py
          python scripts/browser_tools.py
          python scripts/browser_leaderboard.py
      - name: Commit validated changes on this branch only
        run: |
          set -eu
          test "${{ github.ref_name }}" = "$BRANCH"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          rm maintenance/.protocol-navigation-patch .github/workflows/prepare-protocol-navigation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md app.js maintenance/leaderboard-analysis.md research.css research.js scripts/browser_leaderboard.py scripts/test_leaderboard_controls.cjs maintenance/.protocol-navigation-patch .github/workflows/prepare-protocol-navigation.yml
          git commit -m 'Group leaderboard navigation by source while preserving exact protocols'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Preserve source candidate
        if: always()
        run: |
          mkdir -p /tmp/radar-navigation
          git archive --format=zip --output=/tmp/radar-navigation/source.zip HEAD
          git rev-parse HEAD > /tmp/radar-navigation/head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-navigation-audit-${{ github.run_id }}
          path: |
            /tmp/radar-navigation/
            /tmp/radar-leaderboard/
          retention-days: 14
