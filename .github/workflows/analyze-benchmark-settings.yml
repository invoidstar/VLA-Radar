name: Analyze benchmark setting candidates
on:
  push:
    branches: ['feature/benchmark-settings-all-2026-09-20']
    paths: ['.github/scripts/analyze_benchmark_settings.py']
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/analyze_benchmark_settings.py
