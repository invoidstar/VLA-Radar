name: Prepare benchmark batch thirteen v2
on:
  push:
    branches: [weekly-update-2026-09-19-benchmark-batch13]
    paths: [.github/workflows/prepare-batch13-v2.yml]
permissions:
  contents: write
concurrency:
  group: prepare-batch13-v2
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed payload from retained preparation source
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          BASE='14f2520c942990d2b57469277c1ca92b9059b7bc'
          assert subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()==BASE
          lines=Path('.github/workflows/prepare-batch13.yml').read_text().splitlines()
          start=next(i for i,x in enumerate(lines) if x.strip()=="python - <<'PY'")+1
          end=next(i for i in range(start,len(lines)) if "ch=Path('CHANGELOG.md').read_text()" in lines[i])
          code='\n'.join(x[10:] if x.startswith('          ') else x for x in lines[start:end])
          exec(compile(code,'batch13_payload.py','exec'),{})
          for pid in ['p017','p035','p036','p023','p039']:
              q=Path('catalog/papers/'+pid+'.json'); obj=__import__('json').loads(q.read_text())
              obj['note']['benchmarkReview']['status']='extracted'
              q.write_text(__import__('json').dumps(obj,ensure_ascii=False,indent=2)+'\n')
          q=Path('catalog/benchmarks.json'); obj=__import__('json').loads(q.read_text())
          for t in obj['tracks']:
              if t['id'].startswith('tau0-v1-'): t['dataset']='Tau0-VLA real robot'
              if t['id']=='dswam-v1-sorting-errors': t['unit']='score'
          q.write_text(__import__('json').dumps(obj,ensure_ascii=False,indent=2)+'\n')
          ch=Path('CHANGELOG.md').read_text()
          entry="\n".join([
            "## 2026-09-19 · 第十三批：五篇原始证据回补","",
            "- 深读/复核 τ0-VLA、Co-training Study、HALO、DSWAM、VERITAS；五篇 deferred→extracted。",
            "- 新增52条源定位结果、16个明确设置；成功率、时间、错误数与训练阶段分开；不从图高或相对增益反推精确值。",
            "- 保留HALO非逐项最优、CoT/离散token无显著收益、DSWAM单任务非全优、VERITAS小样本差异等边界。",
            "- 不改UI/导航，不清理历史/安全分支，不推进完整周检索检查点。",""
          ])+"\n"
          if "第十三批：五篇原始证据回补" not in ch: Path('CHANGELOG.md').write_text(entry+ch)
          test="\n".join([
            "import json","from pathlib import Path","R=Path(__file__).resolve().parents[1]",
            "def j(p): return json.loads((R/p).read_text())",
            "def test_batch13_counts():",
            "    r=j('maintenance/benchmark-review.json')['papers']",
            "    assert all(r[x]['status']=='extracted' for x in ['p017','p035','p036','p023','p039'])",
            "    assert sum(x['status']=='extracted' for x in r.values())==62",
            "    assert sum(x['status']=='deferred' for x in r.values())==34",
            "    assert len(j('catalog/benchmarks.json')['tracks'])==194",
            "    assert len(list((R/'catalog/results').glob('r-*.json')))==720",
            "def test_tau0_ttc():",
            "    assert j('catalog/results/r-tau0-v1-ttc-ttc.json')['values']=={'Make Milk Tea':70,'Book Organization':90,'Clean Room':70}",
            "def test_cotrain_no_reverse():",
            "    x=j('catalog/results/r-cotrain-v1-sim-unseen-final.json'); assert x['values']['Average']==72.6 and '不由36.4' in x['evaluationNotes']",
            "def test_halo_negative_boundary():",
            "    assert j('catalog/results/r-halo-rss26-sim-hand.json')['values']['Retrieve Object']==68",
            "    assert j('catalog/results/r-halo-rss26-sim-halo.json')['values']['Retrieve Object']==64",
            "def test_dswam_units():",
            "    t={x['id']:x for x in j('catalog/benchmarks.json')['tracks']}",
            "    assert t['dswam-v1-real-folding-time']['unit']=='seconds' and t['dswam-v1-sorting-errors']['direction']=='lower'",
            "    assert j('catalog/results/r-dswam-v1-fold-time-dswam.json')['values']['Average']==104",
            "def test_veritas_small_n():",
            "    x=j('catalog/results/r-veritas-v1-carrot50-auto.json'); assert x['values']['Success']==70 and '20' in x['evaluationNotes']",""
          ])
          Path('tests/test_benchmark_batch13.py').write_text(test)
          bt=Path('scripts/browser_tools.py'); btc=bt.read_text()
          old="page.locator('.radar-manager summary').click();page.locator('[data-manager-tab=\"datasets\"]').click();page.locator('[data-follow-value=\"LIBERO\"]').click();expect(page.locator('[data-follow-value=\"LIBERO\"]')).to_have_attribute('aria-pressed','true')"
          new="page.locator('.radar-manager summary').click();page.locator('[data-manager-tab=\"datasets\"]').click();page.locator('#radar-manage-query').fill('LIBERO');page.locator('[data-follow-value=\"LIBERO\"]').click();expect(page.locator('[data-follow-value=\"LIBERO\"]')).to_have_attribute('aria-pressed','true');page.locator('#radar-manage-query').fill('')"
          assert old in btc, 'browser tools dataset-follow assumption changed upstream'
          bt.write_text(btc.replace(old,new))
          subprocess.run(['python','scripts/capture_activity.py','--base',BASE,'--at','2026-09-19T15:45:00Z'],check=True)
          subprocess.run(['python','scripts/build_catalog.py'],check=True)
          PY
      - name: Full validation
        run: python scripts/validate_all.py
      - name: Install browser environment
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk; fi
      - name: Run all six browser suites
        run: |
          for s in browser_smoke browser_workspace browser_news browser_sidebar browser_tools browser_leaderboard; do python scripts/$s.py; done
      - name: Verify and save candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('maintenance/benchmark-review.json').read_text())['papers']
          assert sum(x['status']=='extracted' for x in r.values())==62
          assert sum(x['status']=='deferred' for x in r.values())==34
          assert len(json.loads(Path('catalog/benchmarks.json').read_text())['tracks'])==194
          assert len(list(Path('catalog/results').glob('r-*.json')))==720
          print('batch13 exact counts OK')
          PY
          git add CHANGELOG.md catalog maintenance tests data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize batch thirteen after full source and browser validation'
          git push origin HEAD:refs/heads/weekly-update-2026-09-19-benchmark-batch13
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-batch13-audit-v2
          path: |
            maintenance/benchmark-source-audit-20260919-batch13.json
            tests/test_benchmark_batch13.py
          retention-days: 14
