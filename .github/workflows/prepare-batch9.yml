name: Prepare benchmark evidence batch nine
on:
  push:
    branches: [weekly-update-2026-09-19-benchmark-batch9]
    paths: [.github/workflows/prepare-batch9.yml]
permissions:
  contents: write
concurrency:
  group: prepare-batch9-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: bc3710056abe6cd3407c1e6b74d184c25c6f4fed
      BRANCH: weekly-update-2026-09-19-benchmark-batch9
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checksum-verified canonical changes on exact main
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p /tmp/radar-batch9
          python - <<'PY'
          import base64,hashlib,json,lzma,os
          from pathlib import Path
          sums=['14d0923738dc486558a9de9094324823e7b69febb9a01e1359b2bd2acc81e903','75eb3a0b46d7a8d60152e46b5731a2a17fdfd46654769f10d36d9161f190ed54','8b2a34f1084571e2567a93b0646bd740522198fc3e722032d0361b18e68a2c7d']
          parts=[]
          for i,expected in enumerate(sums):
              raw=Path(f'maintenance/.batch9-part{i}').read_bytes()
              assert hashlib.sha256(raw).hexdigest()==expected, f'Transport mismatch part {i}'
              parts.append(raw)
          compressed=base64.b64decode(b''.join(parts),validate=True)
          assert len(compressed)==27964 and hashlib.sha256(compressed).hexdigest()=='3cd007cfd7b396026067985ec33d8c7091a30974eaab3b1f6aafd50066a167ba'
          payload=json.loads(lzma.decompress(compressed))
          assert payload['schemaVersion']==1 and payload['baseCommit']==os.environ['BASE']
          fixed={'CHANGELOG.md','catalog/benchmarks.json','catalog/bibliography.json','catalog/papers/p048.json','catalog/papers/p050.json','catalog/papers/p062.json','maintenance/benchmark-review.json','maintenance/benchmark-source-audit-20260919-batch9.json','maintenance/publication-candidates.json','maintenance/work-queue.json','tests/test_benchmark_batch9.py'}
          assert len(payload['files'])==53
          planned=[];seen=set();result_count=0
          for f in payload['files']:
              name=f['path'];path=Path(name)
              is_result=name.startswith('catalog/results/r-') and name.endswith('.json') and len(path.parts)==3
              assert (name in fixed or is_result) and name not in seen and not path.is_absolute() and '..' not in path.parts
              if is_result:
                  assert f['before'] is None
                  result_count+=1
              seen.add(name)
              old=path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==f['before'], 'Changed preimage: '+name
              text=old.decode('utf-8') if old is not None else ''
              original_length=len(text);previous_end=0
              for start,end,replacement in f['edits']:
                  assert isinstance(start,int) and isinstance(end,int) and isinstance(replacement,str)
                  assert previous_end<=start<=end<=original_length
                  previous_end=end
              for start,end,replacement in reversed(f['edits']):
                  text=text[:start]+replacement+text[end:]
              final=text.encode('utf-8')
              assert hashlib.sha256(final).hexdigest()==f['after'], 'Target mismatch: '+name
              planned.append((path,final))
          assert fixed<=seen and result_count==42
          for path,data in planned:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          Path('/tmp/radar-batch9/transport-verification.json').write_text(json.dumps({'base':os.environ['BASE'],'operations':53,'compressedSHA256':hashlib.sha256(compressed).hexdigest(),'targetHashes':{f['path']:f['after'] for f in payload['files']}},indent=2))
          print('PASS: all 53 canonical/test operations match exact preimages and target hashes.')
          PY
          python scripts/capture_activity.py --base "$BASE" | tee /tmp/radar-batch9/activity.log
          python scripts/build_catalog.py
          set -o pipefail
          python scripts/validate_all.py 2>&1 | tee /tmp/radar-batch9/validation.log
      - name: Verify original records, metric boundaries and genuine progress
        run: |
          python - <<'PY'
          import json,os,subprocess,collections
          from pathlib import Path
          base=os.environ['BASE'];targets={'p048','p050','p062'}
          def prior(path): return subprocess.check_output(['git','show',base+':'+path])
          def before(path): return json.loads(prior(path))
          def now(path): return json.loads(Path(path).read_text())
          oldpaths=subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines()
          preserved=[]
          for path in oldpaths:
              p=Path(path)
              protect=(path.startswith('catalog/papers/') and p.stem not in targets) or path.startswith(('catalog/results/','catalog/news/','.github/')) or path in {'catalog/first-public.json','catalog/manifest.json','maintenance/state.json','maintenance/news-state.json'} or p.suffix in {'.js','.css','.html','.svg'}
              if protect:
                  assert p.read_bytes()==prior(path), 'Old content changed: '+path
                  preserved.append(path)
          audit=now('maintenance/benchmark-source-audit-20260919-batch9.json')
          for pid in targets:
              path='catalog/papers/'+pid+'.json';old=before(path);new=now(path)
              for key in ['id','title','arxiv','firstPublished']:
                  assert old['paper'].get(key)==new['paper'].get(key), (pid,key)
              assert len(new['note']['sections'])==9 and sum(len(s['body']) for s in new['note']['sections'])>2800
              assert all(s['sources'] for s in new['note']['sections'])
              assert len(new['note']['figures'])==2 and len(new['note']['tables'])==1
              if pid=='p062': assert old['paper']['findings']==new['paper']['findings']
              else:
                  c=next(x for x in audit['keyResultCorrections'] if x['paperId']==pid)
                  assert c['before']==old['paper']['findings'] and c['after']==new['paper']['findings'] and c['source']
          oldtracks={t['id']:t for t in before('catalog/benchmarks.json')['tracks']}
          tracks=now('catalog/benchmarks.json')['tracks'];trackmap={t['id']:t for t in tracks}
          assert all(trackmap[k]==v for k,v in oldtracks.items())
          oldbib=before('catalog/bibliography.json')['entries'];bib=now('catalog/bibliography.json')['entries']
          assert all(bib[k]==v for k,v in oldbib.items() if k not in targets)
          oldevents={e['id']:e for e in before('catalog/activity.json')['events']}
          events=now('catalog/activity.json')['events'];eventmap={e['id']:e for e in events}
          assert all(eventmap[k]==v for k,v in oldevents.items())
          newevents=[e for e in events if e['id'] not in oldevents]
          assert len(newevents)==48 and collections.Counter(e['kind'] for e in newevents)=={'result':42,'note':3,'publication':3}
          assert all(e['baseCommit']==base for e in newevents)
          papers=now('data/library.json')['papers'];board=now('data/leaderboards.json')
          ledger=collections.Counter(v['status'] for v in now('maintenance/benchmark-review.json')['papers'].values())
          report={'base':base,'papers':len(papers),'results':len(board['results']),'tracks':len(tracks),'datasetGroups':len({t['dataset'] for t in tracks}),'benchmarkDisposition':dict(ledger),'preservedFiles':len(preserved),'newResults':len(audit['newResults']),'newTracks':len(audit['newTracks']),'newActivity':len(newevents),'keyResultCorrections':2,'noteQueue':now('maintenance/work-queue.json')['remainingNotes']}
          assert report['papers']==98 and report['results']==447 and report['tracks']==124 and report['datasetGroups']==20
          assert ledger=={'extracted':48,'deferred':48,'not-applicable':2}
          assert len(audit['newResults'])==42 and len(audit['newTracks'])==13
          Path('/tmp/radar-batch9/invariance.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Install browser driver and CJK fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update -qq; sudo apt-get install -y fonts-noto-cjk; fi
      - name: Run all six existing real HTTP browser suites
        run: |
          python scripts/browser_smoke.py
          python scripts/browser_workspace.py
          python scripts/browser_news.py
          python scripts/browser_sidebar.py
          python scripts/browser_tools.py
          python scripts/browser_leaderboard.py
      - name: Commit only validated content on this branch
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          rm maintenance/.batch9-part0 maintenance/.batch9-part1 maintenance/.batch9-part2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog data maintenance CHANGELOG.md tests/test_benchmark_batch9.py
          git diff --cached --stat
          git commit -m 'Backfill CALVIN, DROID and SayCan original evidence with 42 results'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Retain actual source and audit without PDFs or credentials
        if: always()
        run: |
          mkdir -p /tmp/radar-batch9
          git archive --format=zip --output=/tmp/radar-batch9/source.zip HEAD
          git rev-parse HEAD > /tmp/radar-batch9/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-batch9-audit-${{ github.run_id }}
          path: |
            /tmp/radar-batch9/
            /tmp/radar-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
            /tmp/radar-leaderboard/
          retention-days: 14
