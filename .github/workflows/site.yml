name: VLA Radar CI and Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vla-radar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Pin browsers and all native dependencies together. The previous Ubuntu
    # host install exceeded 20 minutes on apt mirrors; downloading browsers
    # alone then failed WebKit due to missing shared libraries.
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical records, generated files and regression tests
        run: python scripts/validate/validate_all.py
      - name: Verify pinned browser engines and test runtime
        env:
          # GitHub sets HOME=/github/home (pwuser-owned) while container steps
          # execute as root. Firefox refuses that mismatch; use root's HOME.
          HOME: /root
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          node --version
          python - <<'PY'
          import shutil
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              for name in ('chromium', 'firefox', 'webkit'):
                  engine=getattr(p,name)
                  opts={'headless':True}
                  if name=='chromium':
                      opts['executable_path']=shutil.which('google-chrome') or shutil.which('chromium')
                  browser=engine.launch(**opts)
                  page=browser.new_page()
                  page.goto('data:text/html,<title>health</title>')
                  assert page.title()=='health', name
                  browser.close()
                  print('PASS pinned browser',name)
          PY
      - name: Browser HTTP, worker, persistence and responsive regression
        env:
          HOME: /root
        run: |
          python scripts/browser/browser_smoke.py
          python scripts/browser/browser_math.py
          python scripts/browser/browser_workspace.py
          python scripts/browser/browser_news.py
          python scripts/browser/browser_sidebar.py
          python scripts/browser/browser_tools.py
          python scripts/browser/browser_leaderboard.py
          python scripts/browser/browser_official_boards.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit-${{ github.run_id }}
          path: |
            /tmp/radar-browser/
            /tmp/radar-math-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
            /tmp/radar-leaderboard/
            /tmp/radar-official-boards/
          retention-days: 14

  stage:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated files are current
        run: python scripts/build/build_catalog.py --check
      - name: Stage public website only
        run: python scripts/build/stage_site.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.stage.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  production-smoke:
    if: needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed Pages assets and deep link
        run: python scripts/validate/production_smoke.py --base "${{ needs.deploy.outputs.page_url }}"
