name: Validate and deploy VLA Radar
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical records, generated files and regression tests
        run: python scripts/validate_all.py
      - name: Check Pages enablement
        if: github.event_name != 'pull_request'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if test "$enabled" != 'true'; then
            echo 'Validation passed. Pages is disabled; no deployment occurred.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage public website only
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/data
          cp index.html styles.css research.css app.js research.js dates.js favicon.svg _site/
          cp data/papers.json data/catalog.json data/leaderboards.json _site/data/
          cp -R data/details _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.outputs.pages_enabled == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
