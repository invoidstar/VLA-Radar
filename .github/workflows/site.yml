name: Validate and deploy VLA Radar
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical records, generated files and regression tests
        run: python scripts/validate_all.py
      - name: Install browser test driver and CJK test fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Browser HTTP, worker, persistence and responsive regression
        run: |
          python scripts/browser_smoke.py
          python scripts/browser_workspace.py
          python scripts/browser_news.py
          python scripts/browser_sidebar.py
          python scripts/browser_tools.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit-${{ github.run_id }}
          path: |
            /tmp/radar-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
          retention-days: 14
      - name: Check Pages enablement
        if: github.event_name != 'pull_request'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if test "$enabled" != 'true'; then
            echo 'Validation passed. Pages is disabled; no deployment occurred.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage public website only
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/data
          cp index.html styles.css research.css app.js research.js dates.js runtime.js search-core.js search-client.js search-worker.js favicon.svg experience-loader.js experience-core.js experience.js experience.css news-core.js news.js news.css sidebar.js sidebar.css _site/
          cp tools-loader.js tools-core.js tools.js tools.css _site/
          cp -R data/. _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.outputs.pages_enabled == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
