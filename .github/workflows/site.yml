name: VLA Radar CI and Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vla-radar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical records, generated files and regression tests
        run: python scripts/validate/validate_all.py
      # Cache only browser binaries. System dependencies are provided by the
      # Ubuntu runner; --with-deps unexpectedly downloads an entire multimedia
      # apt dependency tree and can exhaust the job's 20-minute timeout.
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.57.0-ubuntu-24.04-firefox-webkit-v1
      - name: Install browser test drivers (without slow apt --with-deps)
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install firefox webkit
          # Preserve all three browser engines in the regression suite. Fail
          # rather than silently skipping Firefox or WebKit if a dependency is
          # genuinely absent from the runner image.
      - name: Ensure CJK test fonts (only if absent)
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            echo "::notice::No CJK font detected. Installing minimal Noto CJK fonts."
            sudo apt-get -o Acquire::Retries=2 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
      - name: Browser HTTP, worker, persistence and responsive regression
        run: |
          python scripts/browser/browser_smoke.py
          python scripts/browser/browser_math.py
          python scripts/browser/browser_workspace.py
          python scripts/browser/browser_news.py
          python scripts/browser/browser_sidebar.py
          python scripts/browser/browser_tools.py
          python scripts/browser/browser_leaderboard.py
          python scripts/browser/browser_official_boards.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit-${{ github.run_id }}
          path: |
            /tmp/radar-browser/
            /tmp/radar-math-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
            /tmp/radar-leaderboard/
            /tmp/radar-official-boards/
          retention-days: 14

  stage:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated files are current
        run: python scripts/build/build_catalog.py --check
      - name: Stage public website only
        run: python scripts/build/stage_site.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.stage.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  production-smoke:
    if: needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed Pages assets and deep link
        run: python scripts/validate/production_smoke.py --base "${{ needs.deploy.outputs.page_url }}"
