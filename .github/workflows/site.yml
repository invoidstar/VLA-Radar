name: Validate and deploy VLA Radar
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical records, generated files and regression tests
        run: python scripts/validate/validate_all.py
      - name: Install browser test drivers and CJK test fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps firefox webkit
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Browser HTTP, worker, persistence and responsive regression
        run: |
          python scripts/browser/browser_smoke.py
          python scripts/browser/browser_math.py
          python scripts/browser/browser_workspace.py
          python scripts/browser/browser_news.py
          python scripts/browser/browser_sidebar.py
          python scripts/browser/browser_tools.py
          python scripts/browser/browser_leaderboard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit-${{ github.run_id }}
          path: |
            /tmp/radar-browser/
            /tmp/radar-math-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
            /tmp/radar-leaderboard/
          retention-days: 14
      - name: Check Pages enablement
        if: github.event_name != 'pull_request'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages')
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if test "$enabled" != 'true'; then
            echo 'Validation passed. Pages is disabled; no deployment occurred.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage public website only
        if: github.event_name != 'pull_request'
        run: python scripts/build/stage_site.py --output _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.outputs.pages_enabled == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  production-smoke:
    if: needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed Pages assets and deep link
        run: python scripts/validate/production_smoke.py --base "${{ needs.deploy.outputs.page_url }}"
