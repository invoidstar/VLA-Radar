name: Safe merged-branch housekeeping
on:
  schedule:
    - cron: '20 1 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete eligible unchanged merged branches
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: safe-branch-housekeeping
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'invoidstar/VLA-Radar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Audit protection without changing existing rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/maintenance/configure_main_protection.py --output /tmp/radar-protection-audit.json
      - name: Prune only exact heads with merged PR evidence and a published main
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          if test "$APPLY" = true; then
            python scripts/maintenance/repo_housekeeping.py --apply --output /tmp/radar-branch-audit.json
          else
            python scripts/maintenance/repo_housekeeping.py --output /tmp/radar-branch-audit.json
          fi
      - name: Record audit summary
        if: always()
        run: |
          echo '## Branch cleanup and protection audit' >> "$GITHUB_STEP_SUMMARY"
          for f in /tmp/radar-branch-audit.json /tmp/radar-protection-audit.json; do
            test ! -f "$f" || cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: housekeeping-audit-${{ github.run_id }}
          path: /tmp/radar-*-audit.json
          retention-days: 30
