name: Prepare reviewed VLA Radar V2 branch
on:
  push:
    branches: [feature/lifecycle-notes-leaderboards-2026-09-17]
    paths: ['_v2/ready.json']
permissions:
  contents: read
concurrency:
  group: prepare-vla-radar-v2
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'invoidstar/VLA-Radar' && github.ref == 'refs/heads/feature/lifecycle-notes-leaderboards-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lifecycle-notes-leaderboards-2026-09-17
          fetch-depth: 2
      - name: Verify payload, preserve legacy records, build and test
        run: |
          set -o pipefail
          python _v2/apply.py 2>&1 | tee "$RUNNER_TEMP/v2-validation.log"
      - name: Attempt bounded public metadata and source-health scans
        run: |
          set +e
          timeout 240 python scripts/sync_publications.py --apply-safe > "$RUNNER_TEMP/v2-publication.log" 2>&1
          publication_exit=$?
          timeout 240 python scripts/check_sources.py --limit 20 --due-days 30 > "$RUNNER_TEMP/v2-sources.log" 2>&1
          sources_exit=$?
          printf '{"publicationCommandExit":%s,"sourceCommandExit":%s,"sourceLimit":20,"note":"Process exit is not a certification of all publication states. See detailed provider reports and remaining source queue."}\n' "$publication_exit" "$sources_exit" > maintenance/v2-online-attempt.json
          cat "$RUNNER_TEMP/v2-publication.log"
          cat "$RUNNER_TEMP/v2-sources.log"
      - name: Rebuild and validate actual publication changes
        run: |
          set -o pipefail
          python scripts/maintenance_queue.py
          python scripts/build_catalog.py
          python scripts/validate_all.py 2>&1 | tee -a "$RUNNER_TEMP/v2-validation.log"
          test -z "$(git diff --name-only -- .github)"
      - name: Commit validated sources to the feature branch only
        run: |
          set -euo pipefail
          branch='feature/lifecycle-notes-leaderboards-2026-09-17'
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$GITHUB_REPOSITORY" = 'invoidstar/VLA-Radar'
          expected=$(git rev-parse HEAD)
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$expected"
          rm -rf _v2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet || git commit -m 'Implement publication lifecycle, scalable catalog, detailed notes and protocol-specific leaderboards'
          git push origin "HEAD:refs/heads/$branch"
          git archive --format=zip --output="$RUNNER_TEMP/vla-radar-v2-source.zip" HEAD
          echo 'V2 feature branch prepared and tested. Main and Pages were not updated. Manual PR review is required.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vla-radar-v2-validation
          path: |
            ${{ runner.temp }}/v2-*.log
            ${{ runner.temp }}/vla-radar-v2-source.zip
            maintenance/publication-check.json
            maintenance/publication-candidates.json
            maintenance/source-health.json
            maintenance/v2-online-attempt.json
          retention-days: 7
