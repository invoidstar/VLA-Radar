name: Prepare benchmark coverage batch four
on:
  push:
    branches: [weekly-update-2026-09-18-benchmark-batch4]
    paths: [.github/workflows/batch4-prepare.yml]
permissions:
  contents: write
concurrency:
  group: prepare-benchmark-batch4
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: c6ad83af947e619f577ec6f6e27cbecce90092b3
      BRANCH: weekly-update-2026-09-18-benchmark-batch4
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact reviewed source and apply canonical operations
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,os
          checks=[('5fc8ecdb086000b595f6a602f5b45283585f7880e9fb94a0b5202b9ca6c38a92',18000),('6e60d7f2f54024f2c5810e975a00a76943728dc330f9cec64029a006755a9db6',15048)]
          parts=[]
          for i,(expected,size) in enumerate(checks):
              part=Path(f'maintenance/.batch4-part{i}').read_bytes()
              assert len(part)==size and hashlib.sha256(part).hexdigest()==expected, f'Transport mismatch part {i}'
              parts.append(part)
          packed=base64.b64decode(b''.join(parts),validate=True)
          assert len(packed)==24784 and hashlib.sha256(packed).hexdigest()=='62a2bd55824002c23b7fb572eade8b37f72fe5308de7314c1a89ddd940c2fdb2'
          payload=json.loads(lzma.decompress(packed))
          assert payload['schemaVersion']==1 and payload['baseCommit']==os.environ['BASE'] and len(payload['ops'])==42
          exact={'CHANGELOG.md','catalog/benchmarks.json','catalog/bibliography.json','catalog/first-public.json','catalog/manifest.json','maintenance/benchmark-content-policy.md','maintenance/benchmark-review.json','maintenance/benchmark-source-audit-20260918-batch4.json','tests/test_benchmark_batch4.py'}
          newpapers={f'catalog/papers/p{i:03d}.json' for i in range(93,96)}
          planned=[];seen=set()
          for op in payload['ops']:
              path=Path(op['path']);name=path.as_posix()
              assert not path.is_absolute() and '..' not in path.parts and name not in seen
              assert name in exact or name in newpapers or (name.startswith('catalog/results/r-') and name.endswith('.json'))
              seen.add(name)
              old=path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==op['before'], 'Changed base: '+name
              kind=op['op']
              if kind=='create':
                  assert old is None
                  text=op['content']
              elif kind=='prepend':text=op['content']+old.decode('utf-8')
              elif kind=='append':text=old.decode('utf-8')+op['content']
              else:
                  data=json.loads(old)
                  if kind=='append-json-list':
                      target=data[op['key']]
                      assert isinstance(target,list)
                      for item in op['items']:
                          assert item not in target
                          if isinstance(item,dict) and 'id' in item:assert not any(x.get('id')==item['id'] for x in target)
                          target.append(item)
                  elif kind=='merge-json-map':
                      target=data if op['key'] is None else data[op['key']]
                      assert isinstance(target,dict) and not set(target).intersection(op['items'])
                      target.update(op['items'])
                  else:raise ValueError('Unknown operation '+kind)
                  text=json.dumps(data,ensure_ascii=False,indent=2,allow_nan=False)+'\n'
              final=text.encode('utf-8')
              assert hashlib.sha256(final).hexdigest()==op['sha256'], 'Target mismatch: '+name
              planned.append((path,final))
          for path,data in planned:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          print('PASS: all 42 operations matched exact before/after SHA256.')
          PY
          python scripts/capture_activity.py --base "$BASE"
          python scripts/build_catalog.py
          python scripts/validate_all.py
      - name: Verify original records and checkpoints are preserved
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          base=os.environ['BASE']
          def old(p):return subprocess.check_output(['git','show',base+':'+p])
          files=subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines()
          protected=[p for p in files if p.startswith(('catalog/papers/','catalog/results/','catalog/news/')) or p in ['maintenance/state.json','maintenance/news-state.json']]
          assert len(protected)==335
          for p in protected:assert Path(p).read_bytes()==old(p), 'Old record changed: '+p
          for path,key in [('catalog/benchmarks.json','tracks'),('catalog/manifest.json','paperOrder')]:
              before=json.loads(old(path))[key];after=json.loads(Path(path).read_text())[key]
              assert after[:len(before)]==before
          for path,key in [('catalog/first-public.json',None),('catalog/bibliography.json','entries')]:
              before=json.loads(old(path));after=json.loads(Path(path).read_text())
              if key:before,after=before[key],after[key]
              for k,v in before.items():assert after[k]==v
          log=json.loads(Path('catalog/activity.json').read_text());prior=json.loads(old('catalog/activity.json'));ids={e['id'] for e in prior['events']}
          new=[e for e in log['events'] if e['id'] not in ids]
          assert len(new)==33 and all(e['baseCommit']==base for e in new)
          b=json.loads(Path('data/leaderboards.json').read_text());p=json.loads(Path('data/library.json').read_text())['papers']
          assert len(p)==95 and len(b['tracks'])==82 and len(b['results'])==265
          assert len({x['dataset'] for x in b['tracks']})==16
          assert len({r['paperId'] for r in b['results'] if r['evidence']=='checked'})==36
          report={'status':'pass','baseCommit':base,'papers':95,'tracks':82,'results':265,'families':16,'reportingPaperIds':36,'newActivityEvents':len(new),'oldRecordsUnchanged':len(protected)}
          out=Path('/tmp/radar-batch4');out.mkdir(exist_ok=True);(out/'invariance.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          PY
      - name: Install browser driver and CJK fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update -qq; sudo apt-get install -y fonts-noto-cjk; fi
      - name: Run all existing HTTP browser regressions
        run: |
          python scripts/browser_smoke.py
          python scripts/browser_workspace.py
          python scripts/browser_news.py
          python scripts/browser_sidebar.py
          python scripts/browser_tools.py
      - name: Verify new deep readers and benchmark separation
        run: |
          python - <<'PY'
          import json,shutil,socket,subprocess,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('/tmp/radar-batch4');out.mkdir(exist_ok=True)
          s=socket.socket();s.bind(('127.0.0.1',0));port=s.getsockname()[1];s.close()
          server=subprocess.Popen(['python','-m','http.server',str(port),'--bind','127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          base=f'http://127.0.0.1:{port}/';checks=[];errors=[]
          def yes(name,v):
              assert v,name
              checks.append(name)
          try:
              time.sleep(.4)
              with sync_playwright() as p:
                  browser=p.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),headless=True,args=['--no-sandbox'])
                  page=browser.new_page(viewport={'width':1440,'height':1000})
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  for pid in ['p093','p094','p095']:
                      record=json.loads(Path(f'catalog/papers/{pid}.json').read_text());note=record['note']
                      page.goto(base+'?view=reader&paper='+pid,wait_until='networkidle');page.wait_for_selector('.reader-chapter')
                      yes(pid+' nine substantive sections',page.locator('.reader-chapter:not(#reader-evidence)').count()==9)
                      yes(pid+' per-section sources',page.locator('.chapter-sources').count()==9)
                      yes(pid+' explicit figure evidence area',page.locator('#reader-evidence').count()==1)
                      yes(pid+' original first date visible',record['paper']['firstPublished'] in page.locator('.reader-meta').inner_text())
                      yes(pid+' no document overflow',page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'))
                      page.screenshot(path=str(out/(pid+'-reader.png')))
                  page.goto(base+'?view=leaderboards&dataset=MimicGen',wait_until='networkidle');page.wait_for_selector('#show-protocol-chart')
                  yes('MimicGen independent route','dataset=MimicGen' in page.url)
                  yes('MimicGen results visible','MimicGen' in page.locator('main').inner_text())
                  page.screenshot(path=str(out/'mimicgen-board.png'))
                  yes('no uncaught browser errors',not errors)
                  browser.close()
              (out/'browser-batch4.json').write_text(json.dumps({'status':'pass','checks':checks,'count':len(checks),'errors':errors,'scope':'CI HTTP Chromium and viewport, not physical phone or production network'},ensure_ascii=False,indent=2))
              print('PASS:',len(checks),'batch-four browser checks')
          except Exception as e:
              (out/'browser-failure.json').write_text(json.dumps({'error':str(e),'checks':checks,'errors':errors},ensure_ascii=False,indent=2));raise
          finally:server.terminate();server.wait()
          PY
      - name: Commit validated ordinary files to this branch only
        run: |
          set -eu
          test "${{ github.ref_name }}" = "$BRANCH"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git diff --exit-code -- .github
          git rm maintenance/.batch4-part0 maintenance/.batch4-part1
          git add catalog data CHANGELOG.md maintenance/benchmark-content-policy.md maintenance/benchmark-review.json maintenance/benchmark-source-audit-20260918-batch4.json tests/test_benchmark_batch4.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add RoboMimic, MimicGen and DexMimicGen deep notes and 30 original-report results'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Archive retained candidate source
        if: always()
        run: |
          mkdir -p /tmp/radar-batch4
          git archive --format=zip --output=/tmp/radar-batch4/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-batch4-audit-${{ github.run_id }}
          path: |
            /tmp/radar-batch4/
            /tmp/radar-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
          retention-days: 14
