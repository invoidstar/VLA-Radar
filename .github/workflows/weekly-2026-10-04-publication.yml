name: Weekly 2026-10-04 publication closeout
on:
  push:
    branches: ['release/batch-weekly-2026-10-04']
    paths: ['.github/workflows/weekly-2026-10-04-publication.yml']
permissions:
  contents: write
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Complete due publication dry-run
        run: |
          set -eu
          python scripts/maintenance/sync_publications.py --limit 200 --due-days 7 > /tmp/publication-check.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('/tmp/publication-check.json').read_text())
          Path('maintenance/state/publication-check.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit report only
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maintenance/state/publication-check.json
          if ! git diff --cached --quiet; then
            git commit -m 'Complete weekly publication dry-run'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
