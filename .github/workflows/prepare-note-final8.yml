name: Prepare final remaining note reviews
on:
  push:
    branches: [weekly-update-2026-09-20-note-final8]
    paths:
      - .github/workflows/prepare-note-final8.yml
      - .note-final8/**
permissions:
  contents: write
concurrency:
  group: prepare-note-final8
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply latest-version note reviews
        run: python .note-final8/prepare.py
      - name: Full offline validation
        run: python scripts/validate_all.py
      - name: Install browser environment
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk; fi
      - name: Run all six real HTTP browser suites
        run: |
          for s in browser_smoke browser_workspace browser_news browser_sidebar browser_tools browser_leaderboard; do python scripts/$s.py; done
      - name: Verify final note counts and save candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pids=[]
          for q in Path('catalog/papers').glob('p*.json'):
              p=json.loads(q.read_text())
              if p['note']['status']=='needs_review':
                  pids.append(p['paper']['id'])
          assert sorted(pids)==['p043','p046'], pids
          w=json.loads(Path('maintenance/work-queue.json').read_text())
          assert w['remainingNotes']==2
          assert {x['paperId'] for x in w['notes']}=={'p043','p046'}
          review=json.loads(Path('maintenance/benchmark-review.json').read_text())['papers']
          assert sum(x['status']=='extracted' for x in review.values())==94
          assert sum(x['status']=='deferred' for x in review.values())==2
          assert len(json.loads(Path('catalog/benchmarks.json').read_text())['tracks'])==267
          assert len(list(Path('catalog/results').glob('r-*.json')))==962
          print('final note review counts verified')
          PY
          git add CHANGELOG.md catalog maintenance tests data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete six latest-version note reviews and retain two limited-source notes'
          git push origin HEAD:refs/heads/weekly-update-2026-09-20-note-final8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: note-final8-audit
          path: |
            maintenance/note-review-audit-20260920-final8.json
            tests/test_note_final8.py
            /tmp/radar-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
            /tmp/radar-leaderboard/
          retention-days: 14
