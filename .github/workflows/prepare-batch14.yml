name: Prepare source-checked benchmark batch fourteen
on:
  push:
    branches: [weekly-update-2026-09-19-benchmark-batch14]
    paths: [.github/workflows/prepare-batch14.yml, .batch14/prepare.py]
permissions:
  contents: write
concurrency:
  group: prepare-batch14
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply five source-checked papers
        run: python .batch14/prepare.py
      - name: Full validation
        run: python scripts/validate_all.py
      - name: Install browser environment
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk; fi
      - name: Run all six browser suites
        run: |
          for s in browser_smoke browser_workspace browser_news browser_sidebar browser_tools browser_leaderboard; do python scripts/$s.py; done
      - name: Verify counts and save candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('maintenance/benchmark-review.json').read_text())['papers']
          assert sum(x['status']=='extracted' for x in r.values())==67
          assert sum(x['status']=='deferred' for x in r.values())==29
          assert len(json.loads(Path('catalog/benchmarks.json').read_text())['tracks'])==207
          assert len(list(Path('catalog/results').glob('r-*.json')))==775
          print('batch14 counts verified')
          PY
          git add CHANGELOG.md catalog maintenance tests data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize batch fourteen after full source and browser validation'
          git push origin HEAD:refs/heads/weekly-update-2026-09-19-benchmark-batch14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-batch14-audit
          path: |
            maintenance/benchmark-source-audit-20260919-batch14.json
            tests/test_benchmark_batch14.py
          retention-days: 14
