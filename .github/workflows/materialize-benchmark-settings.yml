name: Materialize all-dataset Benchmark settings
on:
  push:
    branches: ['feature/benchmark-settings-all-2026-09-20']
    paths:
      - 'scripts/build/benchmark_settings.py'
      - 'site/js/features/research/benchmark-settings.js'
      - 'catalog/benchmarks.json'
permissions:
  contents: write
concurrency:
  group: benchmark-settings-materialize
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild generated Setting data and validate offline
        run: |
          set -eu
          python scripts/build/build_catalog.py
          python scripts/validate/validate_all.py
      - name: Remove one-shot analysis and materialization workflows
        run: |
          rm -f .github/scripts/analyze_benchmark_settings.py
          rm -f .github/workflows/analyze-benchmark-settings.yml
          rm -f .github/workflows/materialize-benchmark-settings.yml
      - name: Commit deterministic generated outputs
        env:
          BRANCH: ${{ github.ref_name }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -eu
          actual=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$actual" = "$EXPECTED" || { echo "branch moved; refusing overwrite"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize all-dataset Benchmark Setting index and shards'
          git push origin "HEAD:refs/heads/$BRANCH"
