name: Final repository cleanup and consistency audit
on:
  push:
    branches: [release/batch-2026-09-20-final-audit]
    paths:
      - .github/workflows/final-audit.yml
      - .final-audit/**
permissions:
  contents: write
  pull-requests: read
  actions: read
concurrency:
  group: final-repository-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean proven-safe historical branches and build final audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .final-audit/prepare.py
      - name: Full offline repository validation
        run: python scripts/validate_all.py
      - name: Install browser environment
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk; fi
      - name: Run all six real HTTP browser suites
        run: |
          for s in browser_smoke browser_workspace browser_news browser_sidebar browser_tools browser_leaderboard; do python scripts/$s.py; done
      - name: Verify audit files and commit permanent audit only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('maintenance/final-consistency-audit-20260920.json').read_text())
          b=json.loads(Path('maintenance/final-branch-cleanup-20260920.json').read_text())
          assert a['canonical']['papers']==98 and a['canonical']['results']==1063 and a['canonical']['tracks']==286
          assert a['canonical']['benchmarkDisposition']=={'extracted':96,'not-applicable':2}
          assert a['canonical']['remainingNotes']==0
          assert {x['branch'] for x in b['deleted']}=={
            'pre-update-safety-2026-09-17',
            'feature/vla-radar-v2-2026-09-17',
            'weekly-update-2026-09-18-benchmark-batch4'}
          assert a['governance']['branchProtectionReadHttpStatus']==403
          print('final repository audit verified')
          PY
          git add CHANGELOG.md maintenance/final-branch-cleanup-20260920.json maintenance/final-consistency-audit-20260920.json tests/test_final_repository_audit.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record final branch cleanup and repository consistency audit'
          git push origin HEAD:refs/heads/release/batch-2026-09-20-final-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-repository-audit
          path: |
            maintenance/final-branch-cleanup-20260920.json
            maintenance/final-consistency-audit-20260920.json
            /tmp/radar-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
            /tmp/radar-leaderboard/
          retention-days: 30
