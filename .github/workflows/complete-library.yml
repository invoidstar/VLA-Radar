name: Complete and validate source-scoped library
on:
  push:
    branches: [release/batch-2026-09-18-library-completion]
    paths:
      - 'maintenance/deep-reading/*.json'
      - 'scripts/apply_library_completion.py'
      - 'scripts/install_editorial_policy.py'
      - 'scripts/check_editorial.py'
      - 'tests/test_editorial.py'
      - '.github/workflows/complete-library.yml'
permissions:
  contents: write
concurrency:
  group: library-completion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply explicit source-scoped notes and preserve main metadata and results
        run: |
          set -eu
          python scripts/apply_library_completion.py
          python scripts/install_editorial_policy.py
          python scripts/maintenance_queue.py
          python scripts/build_catalog.py
          python scripts/validate_all.py
      - name: Commit validated canonical records and generated outputs to the release branch only
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          test "$BRANCH" = 'release/batch-2026-09-18-library-completion'
          actual=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$actual" = "$EXPECTED_SHA" || { echo 'Branch moved; refusing overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/papers catalog/results catalog/benchmarks.json catalog/manifest.json data maintenance scripts/note_quality.py scripts/validate_all.py research.js AGENTS.md MAINTENANCE.md README.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m 'Complete 78 source-scoped reading guides, preserve 76 full-source scopes and expand benchmark evidence'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: completed-library-validated-source
          retention-days: 14
          path: |
            catalog/
            data/
            maintenance/
            scripts/
            tests/
            *.js
            *.css
            *.html
            *.md
            *.py
            *.svg
