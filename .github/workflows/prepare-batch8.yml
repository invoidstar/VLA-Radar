name: Prepare benchmark evidence batch eight
on:
  push:
    branches: [weekly-update-2026-09-19-benchmark-batch8]
    paths: [.github/workflows/prepare-batch8.yml]
permissions:
  contents: write
concurrency:
  group: prepare-batch8-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'invoidstar/VLA-Radar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: 1f79dbc15f6b00c6a82500d1fafb009435b9220f
      BRANCH: weekly-update-2026-09-19-benchmark-batch8
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checksum-verified canonical changes on exact main
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import base64,hashlib,json,lzma,os
          from pathlib import Path
          sums=['15c392e464770383667017fee3d4c3235606a7cbb9420f74a7a14cdc19400f48','5c1daaa8d2f3a9963ff83a7c260908d101b7c27b7b2954e6371cb394908a7221']
          parts=[]
          for i,expected in enumerate(sums):
              d=Path(f'maintenance/.batch8-part{i}').read_bytes()
              assert hashlib.sha256(d).hexdigest()==expected, f'Transport mismatch {i}'
              parts.append(d)
          compressed=base64.b64decode(b''.join(parts),validate=True)
          assert len(compressed)==20040 and hashlib.sha256(compressed).hexdigest()=='341a0a047013f31371ac01d6bd7425014b9cd567d11f63a042e276a819d0eb31'
          payload=json.loads(lzma.decompress(compressed))
          assert payload['baseCommit']==os.environ['BASE'] and payload['schemaVersion']==1 and len(payload['files'])==39
          fixed={'CHANGELOG.md','catalog/benchmarks.json','catalog/bibliography.json','catalog/papers/p059.json','catalog/papers/p060.json','catalog/papers/p063.json','maintenance/benchmark-review.json','maintenance/work-queue.json','maintenance/benchmark-source-audit-20260919-batch8.json','tests/test_benchmark_batch8.py'}
          prefixes=('catalog/results/r-bridge-real-octo-v2-','catalog/results/r-bridge-real-rtx-v9-','catalog/results/r-google-real-rtx-v9-','catalog/results/r-octo-real-v2-')
          pending=[];seen=set()
          for f in payload['files']:
              name=f['path'];p=Path(name)
              assert name not in seen and not p.is_absolute() and '..' not in p.parts
              assert name in fixed or (name.startswith(prefixes) and name.endswith('.json'))
              seen.add(name);old=p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==f['before'], 'Preimage changed '+name
              text=old.decode('utf-8') if old is not None else '';length=len(text);last=0
              for a,b,value in f['edits']:
                  assert isinstance(a,int) and isinstance(b,int) and isinstance(value,str) and last<=a<=b<=length
                  last=b
              for a,b,value in reversed(f['edits']):text=text[:a]+value+text[b:]
              data=text.encode('utf-8');assert hashlib.sha256(data).hexdigest()==f['after'], 'Postimage mismatch '+name
              pending.append((p,data))
          assert fixed<=seen and len(seen-fixed)==29
          for p,data in pending:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          out=Path('/tmp/radar-batch8');out.mkdir(exist_ok=True)
          (out/'applied-files.json').write_text(json.dumps({'base':payload['baseCommit'],'files':[{'path':f['path'],'before':f['before'],'after':f['after']} for f in payload['files']]},indent=2))
          print('PASS: 39 canonical/test operations match original and target SHA256.')
          PY
          python scripts/capture_activity.py --base "$BASE"
          python scripts/build_catalog.py
          python scripts/validate_all.py
      - name: Preserve earlier science and independently scoped checkpoints
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          base=os.environ['BASE']
          def old(path):return subprocess.check_output(['git','show',base+':'+path])
          originals=subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines();n=0
          for path in originals:
              targeted=path in {'catalog/papers/p059.json','catalog/papers/p060.json','catalog/papers/p063.json'}
              protected=path.startswith(('catalog/results/','catalog/news/','catalog/papers/')) and not targeted
              protected=protected or path in {'maintenance/state.json','maintenance/news-state.json','catalog/first-public.json','catalog/manifest.json'} or path.endswith(('.js','.css','.html','.cjs')) or path.startswith('.github/')
              if protected:assert Path(path).read_bytes()==old(path), 'Unexpected old-content change '+path;n+=1
          for pid in ['p059','p060','p063']:
              path='catalog/papers/'+pid+'.json';a=json.loads(old(path));b=json.loads(Path(path).read_text())
              for field in ['id','title','arxiv','firstPublished','findings']:assert a['paper'][field]==b['paper'][field]
              if pid=='p060':assert a['note']==b['note'], 'Metadata change must not upgrade RoboFlamingo reading'
          for path,key in [('catalog/benchmarks.json','tracks'),('catalog/bibliography.json','entries')]:
              a=json.loads(old(path))[key];b=json.loads(Path(path).read_text())[key]
              if isinstance(a,list):assert b[:len(a)]==a
              else:assert all(b[k]==v for k,v in a.items())
          hist=json.loads(old('catalog/activity.json'))['events'];current=json.loads(Path('catalog/activity.json').read_text())['events'];byid={e['id']:e for e in current};assert all(byid[e['id']]==e for e in hist)
          fresh=[e for e in current if e['id'] not in {v['id'] for v in hist}];assert len(fresh)==34 and all(e['baseCommit']==base for e in fresh)
          boards=json.loads(Path('data/leaderboards.json').read_text());papers=json.loads(Path('data/library.json').read_text())['papers']
          report={'oldProtectedFiles':n,'papers':len(papers),'results':len(boards['results']),'tracks':len(boards['tracks']),'groups':len({t['dataset'] for t in boards['tracks']}),'checkedReportingPapers':len({r['paperId'] for r in boards['results'] if r['evidence']=='checked'}),'activityChanges':len(fresh)}
          assert report['papers']==98 and report['results']==405 and report['tracks']==111 and report['groups']==19 and report['checkedReportingPapers']==45
          Path('/tmp/radar-batch8/invariance.json').write_text(json.dumps(report,indent=2));print(report)
          PY
      - name: Install browser driver and CJK fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update -qq; sudo apt-get install -y fonts-noto-cjk; fi
      - name: Run all six existing real HTTP browser suites
        run: |
          python scripts/browser_smoke.py
          python scripts/browser_workspace.py
          python scripts/browser_news.py
          python scripts/browser_sidebar.py
          python scripts/browser_tools.py
          python scripts/browser_leaderboard.py
      - name: Commit only validated content to this branch
        run: |
          set -eu
          test "$BRANCH" = 'weekly-update-2026-09-19-benchmark-batch8'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          rm maintenance/.batch8-part0 maintenance/.batch8-part1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog data maintenance tests CHANGELOG.md
          git commit -m 'Deepen RT-X and Octo notes, add 29 source-scoped real-robot results and verify publication metadata'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Retain actual candidate without PDFs or credentials
        if: always()
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          out=Path('/tmp/radar-batch8');out.mkdir(exist_ok=True)
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('.').rglob('*'):
                  if not p.is_file() or any(x in {'.git','__pycache__','_site'} for x in p.parts):continue
                  if p.name.startswith('.batch8-part') or p.name=='prepare-batch8.yml':continue
                  if p.suffix.lower() in {'.pdf','.zip','.pyc'}:continue
                  z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-batch8-audit-${{ github.run_id }}
          path: |
            /tmp/radar-batch8/
            /tmp/radar-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
            /tmp/radar-leaderboard/
          retention-days: 14
