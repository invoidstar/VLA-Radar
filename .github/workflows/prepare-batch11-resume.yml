name: Prepare verified benchmark batch eleven
on:
  push:
    branches: [weekly-update-2026-09-19-benchmark-batch11]
    paths: [.github/workflows/prepare-batch11-resume.yml]
permissions:
  contents: write
concurrency:
  group: prepare-batch11-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: d90a5d52f749413f3cc990b2a3abcd8e93202e4a
      BRANCH: weekly-update-2026-09-19-benchmark-batch11
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source-verified deltas on the exact unchanged baseline
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          mkdir -p /tmp/radar-batch11
          python - <<'PY'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          parts = []
          sums = ['60fb807cdc1b2eaef47e7de1819b971c8996898e22973fc4dda6607389decf89', '1e535ed8abd824c708455859262a6b7227b8bbf933aa76ad1ce47292dbd5d854']
          for i, expected in enumerate(sums):
              raw = Path(f'maintenance/.batch11-resume{i}').read_bytes()
              assert hashlib.sha256(raw).hexdigest() == expected, f'Transport mismatch {i}'
              parts.append(raw)
          compressed = base64.b64decode(b''.join(parts), validate=True)
          assert len(compressed) == 20100
          assert hashlib.sha256(compressed).hexdigest() == '1c568143068c16118e338bc357421187c4363c7cda7e715a9111851b3077e57d'
          payload = json.loads(lzma.decompress(compressed))
          assert payload['schemaVersion'] == 1 and payload['baseCommit'] == os.environ['BASE']
          fixed = {'CHANGELOG.md', 'catalog/benchmarks.json', 'catalog/bibliography.json', 'catalog/papers/p044.json', 'catalog/papers/p053.json', 'maintenance/benchmark-review.json', 'maintenance/benchmark-source-audit-20260919-batch11.json', 'maintenance/work-queue.json', 'tests/test_benchmark_batch11.py'}
          prefixes = {'r-ravens-unipi-neurips23-transfer': ['diffuser','image-bc','image-tt','state-bc','unipi'], 'r-unipi-neurips23-compositional': ['diffuser','frame-consistency','frame-only','image-bc','image-tt','no-components','state-bc','unipi'], 'r-vlatouch-v2-property-decisions': ['no-tactile','raw-tactile','structured'], 'r-vlatouch-v2-real-interleaved': ['full','no-control','no-planning'], 'r-vlatouch-v2-real-manipulation': ['interpolant','no-touch','no-vision','rdt','residual']}
          allowed = fixed | {f'catalog/results/{prefix}-{s}.json' for prefix, suffixes in prefixes.items() for s in suffixes}
          assert len(payload['files']) == len(allowed) == 33
          planned = []; seen = set()
          for entry in payload['files']:
              name = entry['path']; path = Path(name)
              assert name in allowed and name not in seen and not path.is_absolute() and '..' not in path.parts
              seen.add(name)
              old = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None) == entry['before'], 'Changed preimage: ' + name
              text = old.decode('utf-8') if old is not None else ''
              original_length = len(text); previous_end = 0
              for start, end, replacement in entry['edits']:
                  assert isinstance(start, int) and isinstance(end, int) and isinstance(replacement, str)
                  assert previous_end <= start <= end <= original_length
                  previous_end = end
              for start, end, replacement in reversed(entry['edits']):
                  text = text[:start] + replacement + text[end:]
              data = text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == entry['after'], 'Target mismatch: ' + name
              planned.append((path, data))
          assert seen == allowed
          for path, data in planned:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          Path('/tmp/radar-batch11/target-hashes.json').write_text(json.dumps({e['path']:e['after'] for e in payload['files']}, indent=2))
          print('PASS: all 33 source operations verified before application.')
          PY
          python scripts/capture_activity.py --base "$BASE" | tee /tmp/radar-batch11/activity.log
          python scripts/build_catalog.py | tee /tmp/radar-batch11/build.log
          python scripts/validate_all.py > /tmp/radar-batch11/validation.log 2>&1 || { cat /tmp/radar-batch11/validation.log; exit 1; }
          cat /tmp/radar-batch11/validation.log
      - name: Check unchanged scientific history and scoped new evidence
        run: |
          python - <<'PY'
          import collections, json, os, subprocess
          from pathlib import Path
          base = os.environ['BASE']
          def prior(path):
              return subprocess.check_output(['git','show',base+':'+path])
          def oldjson(path): return json.loads(prior(path))
          def newjson(path): return json.loads(Path(path).read_bytes())
          paths = subprocess.check_output(['git','ls-tree','-r','--name-only',base], text=True).splitlines()
          immutable = []
          for path in paths:
              if path.startswith('catalog/results/') or path.startswith('catalog/news/') or (path.startswith('catalog/papers/') and path not in {'catalog/papers/p044.json','catalog/papers/p053.json'}) or path in {'catalog/first-public.json','catalog/manifest.json','maintenance/state.json','maintenance/news-state.json','maintenance/github-delivery.md'} or path.startswith('.github/workflows/') or ('/' not in path and Path(path).suffix in {'.js','.css','.html','.svg'}):
                  assert Path(path).read_bytes() == prior(path), 'Unexpected change: '+path
                  immutable.append(path)
          for pid in ['p044','p053']:
              path = f'catalog/papers/{pid}.json'; a = oldjson(path); b = newjson(path)
              for field in ['id','name','title','arxiv','firstPublished']:
                  assert a['paper'][field] == b['paper'][field], (pid,field)
              assert a['publication']['firstArxivAt'] == b['publication']['firstArxivAt']
              assert len(b['note']['sections']) == 9
              assert all(s.get('sources') for s in b['note']['sections'])
          assert oldjson('catalog/papers/p044.json')['publication'] == newjson('catalog/papers/p044.json')['publication']
          assert oldjson('catalog/papers/p044.json')['paper']['findings'] == newjson('catalog/papers/p044.json')['paper']['findings']
          old_tracks = oldjson('catalog/benchmarks.json')['tracks']; new_tracks = newjson('catalog/benchmarks.json')['tracks']
          index = {t['id']:t for t in new_tracks}
          assert all(t == index[t['id']] for t in old_tracks)
          old_bib = oldjson('catalog/bibliography.json'); new_bib = newjson('catalog/bibliography.json')
          for key, value in old_bib.get('items',{}).items(): assert new_bib['items'][key] == value
          old_events = oldjson('catalog/activity.json')['events']; new_events = newjson('catalog/activity.json')['events']
          event_index = {e['id']:e for e in new_events}
          assert all(e == event_index[e['id']] for e in old_events)
          known = {e['id'] for e in old_events}; added = [e for e in new_events if e['id'] not in known]
          kinds = dict(collections.Counter(e['kind'] for e in added))
          assert kinds == {'note':2,'publication':1,'result':24}, kinds
          board = newjson('data/leaderboards.json'); papers = newjson('data/library.json')['papers']
          review = newjson('maintenance/benchmark-review.json')['papers']
          counts = dict(collections.Counter(v['status'] for v in review.values()))
          assert counts == {'extracted':52,'deferred':44,'not-applicable':2}, counts
          assert len(papers) == 98 and len(board['results']) == 507 and len(board['tracks']) == 138
          assert len({t['dataset'] for t in board['tracks']}) == 23
          report = {'base':base,'papers':98,'results':507,'tracks':138,'groups':23,'benchmarkStates':counts,'activity':kinds,'unchangedFileCount':len(immutable),'noteBodyCharacters':{pid:sum(len(s['body']) for s in newjson('catalog/papers/'+pid+'.json')['note']['sections']) for pid in ['p044','p053']}}
          Path('/tmp/radar-batch11/invariance.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Install browser driver and CJK fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update -qq; sudo apt-get install -y fonts-noto-cjk; fi
      - name: Run all six real HTTP browser suites
        run: |
          set -o pipefail
          python scripts/browser_smoke.py | tee /tmp/radar-batch11/browser.log
          python scripts/browser_workspace.py | tee -a /tmp/radar-batch11/browser.log
          python scripts/browser_news.py | tee -a /tmp/radar-batch11/browser.log
          python scripts/browser_sidebar.py | tee -a /tmp/radar-batch11/browser.log
          python scripts/browser_tools.py | tee -a /tmp/radar-batch11/browser.log
          python scripts/browser_leaderboard.py | tee -a /tmp/radar-batch11/browser.log
      - name: Commit validated content only on this branch
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm maintenance/.batch11-part0 maintenance/.batch11-resume0 maintenance/.batch11-resume1
          git add CHANGELOG.md catalog data maintenance tests/test_benchmark_batch11.py
          git commit -m 'Deepen UniPi and VLA-Touch with 24 protocol-scoped original results'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > /tmp/radar-batch11/head.txt
      - name: Preserve actual candidate and diagnostic artifact
        if: always()
        run: |
          mkdir -p /tmp/radar-batch11
          git archive --format=zip --output=/tmp/radar-batch11/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-batch11-audit-${{ github.run_id }}
          path: |
            /tmp/radar-batch11/
            /tmp/radar-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
            /tmp/radar-leaderboard/
          retention-days: 14
