name: Prepare benchmark coverage batch two
on:
  push:
    branches: [weekly-update-2026-09-18-benchmark-batch2]
    paths: [.github/workflows/batch2-prepare.yml]
permissions:
  contents: write
concurrency:
  group: prepare-benchmark-batch2
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: afc42b3e053eb2c2964fae648481c86939e2e77f
      BRANCH: weekly-update-2026-09-18-benchmark-batch2
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check exact source and apply reviewed canonical operations
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,os
          sums=['3b49cbf9c7f2fe0bb377fb6c5d6f88ea3a34da3ac285fbbbf6efb6b7b06710da','dcef365bcf361512896f1e80878556f458e49d7f9bc3788bcde758eaf0e288da','61d747f544b878bcb8bd03a064b7411c97e54c064051bf68b7639deead9819ba']
          parts=[]
          for i,expected in enumerate(sums):
              part=Path(f'maintenance/.batch2-part{i}').read_bytes()
              assert hashlib.sha256(part).hexdigest()==expected, f'Transport mismatch part {i}'
              parts.append(part)
          compressed=base64.b64decode(b''.join(parts),validate=True)
          assert len(compressed)==29864 and hashlib.sha256(compressed).hexdigest()=='b40d4343db30b7e62d6269a592c36a0450ada17f03d4fddabd0240bc89bba423'
          payload=json.loads(lzma.decompress(compressed))
          assert payload['schemaVersion']==1 and payload['baseCommit']==os.environ['BASE'] and len(payload['ops'])==40
          exact={'CHANGELOG.md','catalog/benchmarks.json','catalog/bibliography.json','catalog/first-public.json','catalog/manifest.json','maintenance/benchmark-content-policy.md','maintenance/benchmark-review.json','maintenance/benchmark-source-audit-20260918-batch2.json','tests/test_benchmark_batch2.py'}
          newpapers={f'catalog/papers/p{i:03d}.json' for i in range(86,90)}
          planned=[];seen=set()
          for op in payload['ops']:
              path=Path(op['path']);name=path.as_posix()
              assert not path.is_absolute() and '..' not in path.parts and name not in seen
              assert name in exact or name in newpapers or (name.startswith('catalog/results/r-') and name.endswith('.json'))
              seen.add(name)
              old=path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==op['before'], 'Changed base: '+name
              kind=op['op']
              if kind=='create':
                  assert old is None
                  text=op['content']
              elif kind=='prepend':text=op['content']+old.decode('utf-8')
              elif kind=='append':text=old.decode('utf-8')+op['content']
              else:
                  data=json.loads(old)
                  if kind=='append-json-list':
                      target=data[op['key']]
                      assert isinstance(target,list)
                      for item in op['items']:
                          assert item not in target
                          if isinstance(item,dict) and 'id' in item:assert not any(x.get('id')==item['id'] for x in target)
                          target.append(item)
                  elif kind=='merge-json-map':
                      target=data if op['key'] is None else data[op['key']]
                      assert isinstance(target,dict) and not set(target).intersection(op['items'])
                      target.update(op['items'])
                  else:raise ValueError('Unknown operation '+kind)
                  text=json.dumps(data,ensure_ascii=False,indent=2,allow_nan=False)+'\n'
              final=text.encode('utf-8')
              assert hashlib.sha256(final).hexdigest()==op['sha256'], 'Target mismatch: '+name
              planned.append((path,final))
          for path,data in planned:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          print('PASS: all 40 reviewed operations matched exact before/after hashes.')
          PY
          python scripts/capture_activity.py --base "$BASE"
          python scripts/build_catalog.py
          python scripts/validate_all.py
      - name: Check old scientific records and maintenance checkpoints remain unchanged
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          base=os.environ['BASE']
          def old(p):return subprocess.check_output(['git','show',base+':'+p])
          files=subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines()
          protected=[p for p in files if p.startswith(('catalog/papers/','catalog/results/','catalog/news/')) or p in ['maintenance/state.json','maintenance/news-state.json']]
          for p in protected:assert Path(p).read_bytes()==old(p), 'Old record changed: '+p
          for path,key in [('catalog/benchmarks.json','tracks'),('catalog/manifest.json','paperOrder')]:
              before=json.loads(old(path))[key];after=json.loads(Path(path).read_text())[key]
              assert after[:len(before)]==before
          for path,key in [('catalog/first-public.json',None),('catalog/bibliography.json','entries')]:
              before=json.loads(old(path));after=json.loads(Path(path).read_text())
              if key:before,after=before[key],after[key]
              for k,v in before.items():assert after[k]==v
          log=json.loads(Path('catalog/activity.json').read_text());prior=json.loads(old('catalog/activity.json'));ids={e['id'] for e in prior['events']}
          new=[e for e in log['events'] if e['id'] not in ids]
          assert len(new)==31 and all(e['baseCommit']==base for e in new)
          boards=json.loads(Path('data/leaderboards.json').read_text())
          papers=json.loads(Path('data/library.json').read_text())['papers']
          assert len(papers)==89 and len(boards['tracks'])==65 and len(boards['results'])==209
          assert len({x['dataset'] for x in boards['tracks']})==15
          assert len({r['paperId'] for r in boards['results'] if r['evidence']=='checked'})==30
          assert len(list(Path('catalog/papers').glob('p*.json')))==89
          report={'status':'pass','baseCommit':base,'papers':89,'tracks':65,'results':209,'families':15,'reportingPaperIds':30,'newActivityEvents':len(new),'oldRecordsUnchanged':len(protected)}
          out=Path('/tmp/radar-batch2');out.mkdir(exist_ok=True);(out/'invariance.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          PY
      - name: Install browser driver and Chinese fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update -qq; sudo apt-get install -y fonts-noto-cjk; fi
      - name: Real HTTP browser regression
        run: |
          python scripts/browser_smoke.py
          python scripts/browser_workspace.py
          python scripts/browser_news.py
          python scripts/browser_sidebar.py
          python scripts/browser_tools.py
      - name: Commit validated content to this branch only
        run: |
          set -eu
          test "${{ github.ref_name }}" = "$BRANCH"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git diff --exit-code -- .github
          git rm maintenance/.batch2-part0 maintenance/.batch2-part1 maintenance/.batch2-part2
          git add catalog data CHANGELOG.md maintenance/benchmark-content-policy.md maintenance/benchmark-review.json maintenance/benchmark-source-audit-20260918-batch2.json tests/test_benchmark_batch2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add four deeply read papers and 27 protocol-scoped benchmark results'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Archive tested candidate for recovery
        if: always()
        run: |
          mkdir -p /tmp/radar-batch2
          git archive --format=zip --output=/tmp/radar-batch2/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-batch2-audit-${{ github.run_id }}
          path: |
            /tmp/radar-batch2/
            /tmp/radar-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
          retention-days: 14
