name: Apply staged VLA Radar update

on:
  push:
    branches: [main]
    paths:
      - ".update/READY"

permissions:
  contents: write

concurrency:
  group: vla-radar-staged-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct verified update archive
        shell: bash
        run: |
          set -euo pipefail
          cat .update/staged/part* | base64 --decode > /tmp/vla-radar-update.tar.gz
          echo "65a8b9b98d36545d324ab91433d6308a557b5d70068940e75ae303dc0287c5fa  /tmp/vla-radar-update.tar.gz" | sha256sum -c -
          tar -xzf /tmp/vla-radar-update.tar.gz -C .
      - name: Validate update
        run: |
          python validate.py
          python scripts/check_catalog.py
          node --check app.js
          node scripts/test_dates.cjs
          node scripts/test_urls.cjs
      - name: Commit validated update to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .update
          rm -f .github/workflows/apply-staged-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "Expand landmark VLA papers and add ISO week filtering"
          git push origin HEAD:main
