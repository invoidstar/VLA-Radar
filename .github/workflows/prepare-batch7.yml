name: Prepare benchmark evidence batch seven
on:
  push:
    branches: [weekly-update-2026-09-19-benchmark-batch7]
    paths: [.github/workflows/prepare-batch7.yml]
permissions:
  contents: write
concurrency:
  group: prepare-benchmark-batch7
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE: 5e94eda77c0285f79c6cc6b43bd0e8ed96ff70aa
      BRANCH: weekly-update-2026-09-19-benchmark-batch7
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checksum-verified canonical content on exact baseline
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,os
          sums=['7a37bcdb3f8b2dfd56ed56eaa19e48970dd2a3e68a9bc8a9d7c28965743c555e','d038997bff207792463932fad6db62e25da0b2aee7f57a56a6e55493c8b1d04c','f7e98f4122ef2ce42c25a7749327aee2efc2c629cfce25e312b6c7bcb32dac73','efe46fb4337c6435dda6b5d334ed4d3a2936066c2c32efc8894a978eaeafbd0b']
          parts=[]
          for i,sha in enumerate(sums):
              part=Path(f'maintenance/.batch7-part{i}').read_bytes()
              assert hashlib.sha256(part).hexdigest()==sha, f'Transport mismatch: {i}'
              parts.append(part)
          packed=base64.b64decode(b''.join(parts),validate=True)
          assert len(packed)==28584
          assert hashlib.sha256(packed).hexdigest()=='ae08350ba5f962cdf4b2866569e7d2c776f9a7309973fb8ec0353690bb1e48f4'
          payload=json.loads(lzma.decompress(packed))
          assert payload['schemaVersion']==1 and payload['baseCommit']==os.environ['BASE'] and len(payload['ops'])==48
          allowed={'CHANGELOG.md','catalog/benchmarks.json','catalog/bibliography.json','catalog/papers/p052.json','catalog/papers/p054.json','catalog/papers/p058.json','maintenance/benchmark-content-policy.md','maintenance/benchmark-review.json','maintenance/benchmark-source-audit-20260919-batch7.json','maintenance/work-queue.json','tests/test_benchmark_batch7.py'}
          seen=set();planned=[]
          for op in payload['ops']:
              path=Path(op['path']);name=path.as_posix()
              assert not path.is_absolute() and '..' not in path.parts and name not in seen
              is_result=name.endswith('.json') and (name.startswith('catalog/results/r-google-real-') or name.startswith('catalog/results/r-language-table-palme-'))
              assert name in allowed or is_result, 'Path outside reviewed scope: '+name
              seen.add(name);old=path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None)==op['before'], 'Changed source: '+name
              kind=op['op']
              if kind=='create':
                  assert old is None
                  text=op['content']
              elif kind=='replace':
                  assert old is not None
                  text=op['content']
              elif kind=='prepend':
                  assert name=='CHANGELOG.md'
                  text=op['content']+old.decode('utf-8')
              else:
                  data=json.loads(old);target=data[op['key']]
                  if kind=='append-json-list':
                      assert name=='catalog/benchmarks.json' and op['key']=='tracks' and isinstance(target,list)
                      for item in op['items']:
                          assert not any(x['id']==item['id'] for x in target)
                          target.append(item)
                  elif kind=='merge-json-map':
                      assert name=='catalog/bibliography.json' and op['key']=='entries'
                      assert not set(target).intersection(op['items'])
                      target.update(op['items'])
                  elif kind=='set-json-map-items':
                      assert name=='maintenance/benchmark-review.json' and op['key']=='papers'
                      assert set(op['items'])=={'p052','p054','p058'}
                      assert set(op['items']).issubset(target)
                      target.update(op['items'])
                  else:raise ValueError('Unknown operation '+kind)
                  text=json.dumps(data,ensure_ascii=False,indent=2,allow_nan=False)+'\n'
              final=text.encode('utf-8')
              assert hashlib.sha256(final).hexdigest()==op['sha256'], 'Unexpected target: '+name
              planned.append((path,final))
          for path,data in planned:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          print('PASS: all 48 reviewed canonical operations match exact before/after hashes.')
          PY
          python scripts/capture_activity.py --base "$BASE"
          python scripts/build_catalog.py
          python scripts/validate_all.py
      - name: Check preservation, real activity and protocol identities
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from collections import Counter
          base=os.environ['BASE'];targets={'p052','p054','p058'}
          def old(p):return subprocess.check_output(['git','show',base+':'+p])
          def read(p):return json.loads(Path(p).read_text())
          files=subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines()
          protected=[p for p in files if (p.startswith(('catalog/papers/','catalog/results/','catalog/news/')) and Path(p).stem not in targets) or p in ['maintenance/state.json','maintenance/news-state.json','catalog/first-public.json','catalog/manifest.json']]
          for p in protected:assert Path(p).read_bytes()==old(p),'Old content changed: '+p
          for pid in targets:
              path=f'catalog/papers/{pid}.json';before=json.loads(old(path));after=read(path)
              for k in ['id','name','title','arxiv','firstPublished','findings']:
                  assert before['paper'][k]==after['paper'][k],pid+' identity/key result changed: '+k
              for k in ['firstArxivAt','latestArxivAt','latestArxivVersion']:
                  assert before['publication'].get(k)==after['publication'].get(k),pid+' version metadata changed: '+k
              assert len(after['note']['sections'])==9
              assert all(s['sources'] for s in after['note']['sections'])
          prior_tracks=json.loads(old('catalog/benchmarks.json'))['tracks'];tracks=read('catalog/benchmarks.json')['tracks']
          assert tracks[:len(prior_tracks)]==prior_tracks
          prior_bib=json.loads(old('catalog/bibliography.json'))['entries'];bib=read('catalog/bibliography.json')['entries']
          for k,v in prior_bib.items():assert bib[k]==v
          log=read('catalog/activity.json');prior=json.loads(old('catalog/activity.json'));ids={e['id'] for e in prior['events']}
          byid={e['id']:e for e in log['events']}
          for e in prior['events']:assert byid[e['id']]==e
          added=[e for e in log['events'] if e['id'] not in ids]
          kinds=Counter(e['kind'] for e in added)
          assert kinds=={'result':37,'note':3,'publication':3},dict(kinds)
          assert all(e['baseCommit']==base for e in added)
          boards=read('data/leaderboards.json');papers=read('data/library.json')['papers']
          assert len(papers)==98 and len(boards['tracks'])==103 and len(boards['results'])==376
          assert len({t['dataset'] for t in boards['tracks']})==17
          assert len({r['paperId'] for r in boards['results'] if r['evidence']=='checked'})==43
          report={'status':'pass','baseCommit':base,'papers':98,'results':376,'tracks':103,'families':17,'checkedReportingPapers':43,'oldFilesUnchanged':len(protected),'newActivityEvents':len(added),'activityKinds':dict(kinds),'sourceScope':'Original author experiments, not independent replication'}
          out=Path('/tmp/radar-batch7');out.mkdir(exist_ok=True);(out/'invariance.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));print(json.dumps(report))
          PY
      - name: Install browser driver and Chinese fonts
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then python -m playwright install --with-deps chromium; fi
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update -qq; sudo apt-get install -y fonts-noto-cjk; fi
      - name: Run all existing real HTTP browser regression suites
        run: |
          python scripts/browser_smoke.py
          python scripts/browser_workspace.py
          python scripts/browser_news.py
          python scripts/browser_sidebar.py
          python scripts/browser_tools.py
      - name: Commit validated content to this branch only
        run: |
          set -eu
          test "${{ github.ref_name }}" = "$BRANCH"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git diff --exit-code -- .github
          git rm maintenance/.batch7-part0 maintenance/.batch7-part1 maintenance/.batch7-part2 maintenance/.batch7-part3
          git add catalog data CHANGELOG.md maintenance/benchmark-content-policy.md maintenance/benchmark-review.json maintenance/benchmark-source-audit-20260919-batch7.json maintenance/work-queue.json tests/test_benchmark_batch7.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Deepen RT-1 RT-2 PaLM-E and add 37 original domain-specific results'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Retain exact tested candidate
        if: always()
        run: |
          mkdir -p /tmp/radar-batch7
          git archive --format=zip --output=/tmp/radar-batch7/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-batch7-audit-${{ github.run_id }}
          path: |
            /tmp/radar-batch7/
            /tmp/radar-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
          retention-days: 14
