name: Read benchmark-linked public reports
on:
  push:
    branches: [weekly-update-2026-09-18-benchmark-audit]
    paths: [.github/workflows/benchmark-reading-sources.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read latest public report revisions
        run: |
          python - <<'PY'
          import urllib.request,json,time,hashlib
          from pathlib import Path
          out=Path('/tmp/benchmark-latest');out.mkdir(parents=True,exist_ok=True)
          sources={
            'gwp-v2':'https://arxiv.org/html/2603.17240v2',
            'xpolicylab-v3':'https://arxiv.org/html/2608.09892v3',
            'dp3-v7':'https://arxiv.org/html/2403.03954v7',
            'robodojo-v3':'https://arxiv.org/html/2607.04434v3',
          }
          reports=[]
          for name,url in sources.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'VLA-Radar-public-literature-reading/1.0','Accept':'text/html'})
              with urllib.request.urlopen(req,timeout=30) as r: data=r.read(4000001);status=r.status;final=r.url
              if len(data)>4000000:raise ValueError('source too large')
              (out/(name+'.html')).write_bytes(data)
              reports.append({'name':name,'url':url,'status':status,'finalUrl':final,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
            except Exception as e:reports.append({'name':name,'url':url,'error':str(e)})
            time.sleep(3.2)
          (out/'audit.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2))
          print(json.dumps(reports,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-latest-reading-sources
          path: /tmp/benchmark-latest/
          retention-days: 7
