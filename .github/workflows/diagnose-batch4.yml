name: Diagnose batch four browser rendering
on:
  push:
    branches: [weekly-update-2026-09-19-benchmark-batch4]
    paths: [.github/workflows/diagnose-batch4.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: c6ad83af947e619f577ec6f6e27cbecce90092b3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply same reviewed candidate in disposable worktree
        run: |
          python -m pip install --disable-pip-version-check pyyaml playwright==1.57.0
          python - <<'PY'
          import yaml,subprocess
          from pathlib import Path
          job=yaml.safe_load(Path('.github/workflows/prepare-batch4.yml').read_text())['jobs']['prepare']
          subprocess.run(['bash','-e','-c',job['steps'][1]['run']],check=True)
          PY
      - name: Retain exact failing assertion and report page diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/browser_smoke.py').resolve();s=p.read_text()
          s=s.replace("  page.goto(f'http://127.0.0.1:{port}/',wait_until='networkidle')", "  page.on('console',lambda m:print('BROWSER',m.type,m.text,flush=True))\n  page.on('response',lambda r:print('RESPONSE',r.status,r.url,flush=True) if r.status>=400 else None)\n  page.goto(f'http://127.0.0.1:{port}/',wait_until='networkidle')")
          s=s.replace("  assert page.locator('.paper-card').count()==12", "  print('INITIAL COUNT',page.locator('.paper-card').count(),'ERRORS',errors,flush=True)\n  print('BODY',page.locator('body').inner_text()[:12000],flush=True)\n  page.screenshot(path=str(out/'initial-failure.png'),full_page=True)\n  assert page.locator('.paper-card').count()==12")
          exec(compile(s,str(p),'exec'),{'__file__':str(p),'__name__':'__main__'})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch4-render-diagnostic
          path: /tmp/radar-browser/
          retention-days: 7
