name: Prepare reading workspace release
on:
  push:
    branches: [release/batch-2026-09-18-reading-workspace]
    paths:
      - '.github/workflows/prepare-workspace.yml'
      - 'scripts/install_workspace.py'
      - 'experience*'
      - 'scripts/experience_build.py'
      - 'scripts/capture_activity.py'
      - 'scripts/browser_workspace.py'
      - 'tests/test_experience.py'
      - 'scripts/test_experience.cjs'
permissions:
  contents: write
concurrency:
  group: prepare-workspace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Guarded integration and deterministic build
        run: |
          set -eu
          if test -f scripts/install_workspace.py; then python scripts/install_workspace.py; fi
          python scripts/build_catalog.py
          python scripts/validate_all.py
      - name: Install browser testing tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Actual HTTP browser regression
        run: |
          python scripts/browser_smoke.py
          python scripts/browser_workspace.py
      - name: Verify scientific source invariance and commit only this branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          test "$BRANCH" = 'release/batch-2026-09-18-reading-workspace'
          actual=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$actual" = "$EXPECTED_SHA" || { echo 'Concurrent branch change; not overwriting'; exit 1; }
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          report=json.loads(Path('maintenance/workspace-install.json').read_text())
          for p,h in report['scientificFileHashes'].items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          report['validationStatus']='source invariance, complete offline regression and real HTTP Chromium passed on preparation head'
          Path('maintenance/workspace-install.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js research.js index.html scripts/build_catalog.py scripts/validate_all.py catalog/activity.json data AGENTS.md MAINTENANCE.md README.md CHANGELOG.md
          git add -A maintenance/
          if test -f scripts/install_workspace.py; then git rm scripts/install_workspace.py; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Build validated reading workspace and source-scoped update views'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-${{ github.run_id }}
          path: |
            /tmp/radar-browser/
            /tmp/radar-workspace/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: workspace-validated-source
          path: |
            catalog/
            data/
            maintenance/
            scripts/
            tests/
            *.js
            *.css
            *.html
            *.md
            *.py
            *.svg
          retention-days: 14
