name: Refresh all-dataset Benchmark settings
on:
  push:
    branches: ['feature/benchmark-settings-all-2026-09-20']
    paths: ['scripts/build/benchmark_settings.py','tests/test_benchmark_settings.py']
permissions:
  contents: write
concurrency:
  group: benchmark-settings-refresh
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and validate Setting data
        run: |
          set -eu
          python scripts/build/build_catalog.py
          python scripts/validate/validate_all.py
      - name: Remove one-shot refresh workflow
        run: rm .github/workflows/refresh-benchmark-settings.yml
      - name: Commit deterministic outputs
        env:
          BRANCH: ${{ github.ref_name }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -eu
          actual=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$actual" = "$EXPECTED" || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh Benchmark Settings after training-data normalization'
          git push origin "HEAD:refs/heads/$BRANCH"
