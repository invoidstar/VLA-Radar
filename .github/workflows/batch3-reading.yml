name: Batch three official source reading
on:
  push:
    branches: [weekly-update-2026-09-18-benchmark-batch3]
    paths: [.github/workflows/batch3-reading.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare PDF reader
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.4
      - name: Read fixed public primary sources
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import fitz,hashlib,json,datetime,time
          out=Path('/tmp/batch3-reading');out.mkdir()
          metadata=[]
          for key in ['gervet23a','xian23a']:
              url=f'https://proceedings.mlr.press/v229/{key}/{key}.pdf'
              req=Request(url,headers={'User-Agent':'VLA-Radar source verification','Accept':'application/pdf'})
              with urlopen(req,timeout=45) as response:
                  data=response.read(35000000)
                  assert response.status==200 and data.startswith(b'%PDF')
              doc=fitz.open(stream=data,filetype='pdf')
              record={'source':url,'sha256':hashlib.sha256(data).hexdigest(),'pages':len(doc),'observedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              text=[]
              for i,page in enumerate(doc):
                  text.append(f'\n\n=== PDF PAGE {i+1} ===\n'+page.get_text())
                  if i in [0,2,4,5,6,7,11,12,13,14,15,16]:
                      page.get_pixmap(matrix=fitz.Matrix(1.6,1.6)).save(out/f'{key}-p{i+1}.png')
              (out/f'{key}.txt').write_text(''.join(text))
              metadata.append(record)
              time.sleep(3.1)
          (out/'sources.json').write_text(json.dumps(metadata,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch3-primary-reading
          path: /tmp/batch3-reading/
          retention-days: 3
