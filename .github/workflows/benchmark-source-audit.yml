name: Capture official benchmark sources
on:
  push:
    branches: [weekly-update-2026-09-18-benchmark-audit]
    paths: [.github/workflows/benchmark-source-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1d71d5081305cf3dd0ac3c939cd578fc24bf4ca1
          persist-credentials: false
      - name: Archive exact public baseline
        run: |
          mkdir -p /tmp/benchmark-audit
          git archive --format=zip HEAD -o /tmp/benchmark-audit/baseline.zip
          git rev-parse HEAD > /tmp/benchmark-audit/baseline-sha.txt
      - name: Read official public sources only
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json, hashlib, time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          out=Path('/tmp/benchmark-audit'); reports=[]
          sources={
            'robocasa-home':'https://robocasa.ai/',
            'robocasa-board':'https://robocasa.ai/leaderboard.html',
            'robocasa-protocol':'https://robocasa.ai/docs/benchmarking/benchmarking.html',
            'robotwin-board':'https://robotwin-platform.github.io/leaderboard',
            'robotwin-data':'https://raw.githubusercontent.com/RoboTwin-Platform/RoboTwin-Platform.github.io/main/data/robotwin_leaderboard.json',
            'robodojo-data':'https://raw.githubusercontent.com/RoboTwin-Platform/RoboTwin-Platform.github.io/main/data/robodojo_leaderboard.json',
            'robodojo-real-data':'https://raw.githubusercontent.com/RoboTwin-Platform/RoboTwin-Platform.github.io/main/data/robodojo_real_leaderboard.json',
            'robodojo-home':'https://robodojo-benchmark.com/',
            'libero-home':'https://libero-project.github.io/',
            'calvin-home':'https://calvin.cs.uni-freiburg.de/',
            'rlbench-home':'https://sites.google.com/view/rlbench',
            'simpler-home':'https://simpler-env.github.io/',
            'robomimic-home':'https://robomimic.github.io/',
            'pusht-diffusion-home':'https://diffusion-policy.cs.columbia.edu/',
            'kitchen-d4rl':'https://raw.githubusercontent.com/Farama-Foundation/D4RL/master/README.md',
            'aloha-home':'https://tonyzhaozh.github.io/aloha/',
            'metaworld-home':'https://meta-world.github.io/',
            'colosseum-home':'https://robot-colosseum.github.io/',
            'dexmimicgen-home':'https://dexmimicgen.github.io/',
            'robocasa-submission-index':'https://api.github.com/repos/robocasa-benchmark/leaderboard/contents/submissions',
          }
          def fetch(item):
            name,url=item
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'VLA-Radar-public-benchmark-audit/1.0','Accept':'application/json,text/html,text/plain;q=0.9,*/*;q=0.5'})
              with urllib.request.urlopen(req,timeout=30) as r:
                data=r.read(4_000_001); status=r.status; final=r.url
              if len(data)>4_000_000:raise ValueError('Source exceeds bounded download')
              (out/(name+'.txt')).write_bytes(data)
              return {'name':name,'url':url,'status':status,'finalUrl':final,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
            except Exception as e:return {'name':name,'url':url,'error':str(e)}
          with ThreadPoolExecutor(max_workers=4) as pool:reports.extend(pool.map(fetch,sources.items()))
          index=out/'robocasa-submission-index.txt'
          if index.exists():
            items=json.loads(index.read_text()); urls=[]
            for x in items:
              if x.get('type')=='file' and x['name'].endswith('.json'):
                urls.append(('rcsubmission-'+x['name'],x['download_url']))
            with ThreadPoolExecutor(max_workers=3) as pool:reports.extend(pool.map(fetch,urls))
          (out/'source-audit.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2))
          print(json.dumps(reports,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-benchmark-source-audit
          path: /tmp/benchmark-audit/
          retention-days: 14
