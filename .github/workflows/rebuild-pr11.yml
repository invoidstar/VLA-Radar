name: Rebuild PR11 generated data
on:
  push:
    branches: [weekly-update-2026-09-18-benchmark-audit]
    paths: [.github/workflows/rebuild-pr11.yml]
permissions:
  contents: write
concurrency:
  group: rebuild-pr11-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild generated catalog and validate
        run: |
          python scripts/build_catalog.py
          python scripts/validate_all.py
          git diff --exit-code -- catalog
      - name: Commit generated data only
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          test "$BRANCH" = "weekly-update-2026-09-18-benchmark-audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Rebuild generated data after benchmark review corrections"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
