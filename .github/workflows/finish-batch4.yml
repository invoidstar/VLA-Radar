name: Finish retained benchmark batch four
on:
  push:
    branches: [weekly-update-2026-09-19-benchmark-batch4]
    paths: [.github/workflows/finish-batch4.yml]
permissions:
  contents: write
concurrency:
  group: prepare-retained-batch4
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: c6ad83af947e619f577ec6f6e27cbecce90092b3
      BRANCH: weekly-update-2026-09-19-benchmark-batch4
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute retained exact-source, invariance, browser and branch-commit steps
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import subprocess,yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/prepare-batch4.yml').read_text())['jobs']['prepare']['steps']
          for step in steps[1:6]:
              print('RUN',step['name'],flush=True)
              subprocess.run(['bash','-e','-c',step['run']],check=True)
          PY
      - name: Preserve tested candidate
        if: always()
        run: |
          mkdir -p /tmp/radar-batch4
          git archive --format=zip --output=/tmp/radar-batch4/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-batch4-final-${{ github.run_id }}
          path: |
            /tmp/radar-batch4/
            /tmp/radar-browser/
            /tmp/radar-workspace/
            /tmp/radar-news-browser/
            /tmp/radar-sidebar/
            /tmp/radar-tools/
          retention-days: 14
